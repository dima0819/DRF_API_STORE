name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "SECRET_KEY=ci-only-dummy-key" >> .env

      - name: Run Django tests
        env:
          DEBUG: "0"
        run: python manage.py test

  docker-up:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "SECRET_KEY=ci-only-dummy-key" >> .env

      - name: docker compose up
        run: docker compose up -d --build

      - name: Wait for services and show status
        run: |
          sleep 20
          docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
