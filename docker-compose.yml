services:
  db:
    image: postgres:15
    container_name: store_db_cont
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    # No published port: only other containers need to reach Postgres, via
    # the internal Docker network (hostname "db"). Publishing 5432 to the
    # host isn't needed and would be one more thing to firewall.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: store_redis_cont
    restart: always
    # No published port, same reasoning as db: only reached internally via
    # the "redis" hostname on the Docker network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: store_web
    #command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_data:/app/staticfiles
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SEED_DEMO_DATA=1

  celery:
    build: .
    container_name: store_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  frontend:
    build: ./frontend
    container_name: store_frontend
    restart: always
    volumes:
      - static_data:/var/www/static:ro
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
