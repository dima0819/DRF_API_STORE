# When this container sits behind an HTTPS-terminating reverse proxy (e.g.
# host nginx + Certbot on a home server), pass the original scheme through
# so Django knows the client connection is https. For direct access
# (no upstream proxy) fall back to the local $scheme.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Django REST API
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Django static files (collectstatic output shared via the static_data
    # volume). Served straight from disk - works with DEBUG=False, where
    # Django itself refuses to serve /static/.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    # SPA fallback: every other path is handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
